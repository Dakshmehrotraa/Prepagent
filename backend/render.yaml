services:
  - type: web
    name: prepagent-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6
      - key: ALLOWED_ORIGINS
        value: https://your-prepagent.vercel.app
